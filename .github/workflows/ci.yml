name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # On main, let a run finish: sanitizer jobs need one complete configure to
  # populate the vcpkg cache, and a newer push would otherwise cancel it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VCPKG_COMMIT: 054bd01bec7f31492ec9ac063740cc984a0fe59e
  VCPKG_DISABLE_METRICS: "1"

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format (pinned to the version in .clang-format)
        run: |
          pip install --quiet clang-format==23.1.5
          git ls-files '*.h' '*.cc' | xargs clang-format --dry-run --Werror

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: dev, tidy: true, infra: true }
          - { os: ubuntu-24.04, preset: asan }
          - { os: ubuntu-24.04, preset: tsan }
          - { os: macos-15, preset: dev }
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-18 \
            pkg-config autoconf automake autoconf-archive libtool bison flex
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
          # TSan in clang-18 cannot map shadow memory with 32-bit mmap ASLR entropy.
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf automake libtool

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-bincache
          # asan/tsan presets build dependencies with their own sanitized
          # triplets (triplets/), so each preset has its own package set.
          key: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'triplets/*.cmake') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-

      - name: Bootstrap vcpkg
        run: |
          mkdir -p .vcpkg-bincache
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        id: configure
        run: cmake --preset ${{ matrix.preset }}

      # Saved right after dependencies are built, so a later build or test
      # failure does not throw away an hour of gRPC/abseil compilation.
      - name: Save vcpkg binary cache
        if: always() && steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-bincache
          key: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'triplets/*.cmake') }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The lightning-deal integration tests run against real services on the
      # dev job; elsewhere they skip themselves.
      - name: Start Postgres, Redis and Redpanda
        if: matrix.infra
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=cartwheel \
            -e POSTGRES_PASSWORD=cartwheel -e POSTGRES_DB=cartwheel_test postgres:17
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          docker run -d --name redpanda -p 9092:9092 redpandadata/redpanda:v24.2.7 \
            redpanda start --mode=dev-container --smp=1 --memory=1G \
            --kafka-addr=PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr=PLAINTEXT://127.0.0.1:9092
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U cartwheel >/dev/null 2>&1 \
              && docker exec redpanda rpk cluster health --exit-when-healthy >/dev/null 2>&1 \
              && break
            sleep 2
          done
          echo "CW_TEST_POSTGRES=postgresql://cartwheel:cartwheel@127.0.0.1:5432/cartwheel_test" >> "$GITHUB_ENV"
          echo "CW_TEST_REDIS=redis://127.0.0.1:6379" >> "$GITHUB_ENV"
          echo "CW_TEST_KAFKA=127.0.0.1:9092" >> "$GITHUB_ENV"

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: clang-tidy (pinned; same major version as local Homebrew LLVM)
        if: matrix.tidy
        run: |
          pip install --quiet clang-tidy==23.1.4
          git ls-files 'src/*.cc' 'tests/*.cc' 'bench/*.cc' \
            | xargs -P "$(nproc)" -n 4 clang-tidy -p build/${{ matrix.preset }} --quiet
