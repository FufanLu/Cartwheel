# Keep a caller-supplied request id, otherwise mint one. The gateway echoes it
# and forwards it to gRPC metadata, so one id threads through every log line.
map $http_x_request_id $cw_request_id {
  default $http_x_request_id;
  ''      $request_id;
}

upstream cartwheel_gateway {
  server gateway:8080;
  keepalive 64;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://cartwheel_gateway;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $cw_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }

  location = /healthz {
    proxy_pass http://cartwheel_gateway;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
