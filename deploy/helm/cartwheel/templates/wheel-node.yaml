# CartwheelKV: a StatefulSet, so each pod keeps its name (the node id), its
# DNS name (how peers reach it) and its volume (the LSM data) across restarts.
apiVersion: v1
kind: Service
metadata:
  name: wheel-node
  labels: { app: wheel-node }
spec:
  clusterIP: None              # headless: per-pod DNS for gossip and replica traffic
  publishNotReadyAddresses: true
  selector: { app: wheel-node }
  ports:
    - { name: grpc, port: 7100 }
    - { name: metrics, port: 9100 }
---
apiVersion: v1
kind: Service
metadata:
  name: wheel
spec:
  selector: { app: wheel-node }  # client entry point: any node coordinates
  ports:
    - { name: grpc, port: 7100 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wheel-node
spec:
  serviceName: wheel-node
  replicas: {{ .Values.kv.replicas }}
  podManagementPolicy: Parallel  # nodes find each other through gossip; no ordering needed
  selector:
    matchLabels: { app: wheel-node }
  template:
    metadata:
      labels: { app: wheel-node }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      terminationGracePeriodSeconds: 15
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: wheel-node
          image: {{ include "cartwheel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["wheel-node"]
          env:
            {{- include "cartwheel.common.env" . | nindent 12 }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: CARTWHEEL_NODE_ID, value: "$(POD_NAME)" }
            - { name: CARTWHEEL_NODE_ADVERTISE, value: "$(POD_NAME).wheel-node:7100" }
            - { name: CARTWHEEL_SERVER_LISTEN, value: "0.0.0.0:7100" }
            - { name: CARTWHEEL_METRICS_LISTEN, value: "0.0.0.0:9100" }
            - { name: CARTWHEEL_STORAGE_ENGINE, value: lsm }
            - { name: CARTWHEEL_STORAGE_DIR, value: /data }
            - { name: CARTWHEEL_CLUSTER_ENABLED, value: "true" }
            - { name: CARTWHEEL_CLUSTER_SEEDS, value: {{ include "cartwheel.kvSeeds" . | quote }} }
            - { name: CARTWHEEL_CLUSTER_N, value: {{ .Values.kv.replication | quote }} }
            - { name: CARTWHEEL_CLUSTER_R, value: {{ .Values.kv.readQuorum | quote }} }
            - { name: CARTWHEEL_CLUSTER_W, value: {{ .Values.kv.writeQuorum | quote }} }
            - { name: CARTWHEEL_DEBUG_FAULT_INJECTION, value: {{ .Values.kv.faultInjection | quote }} }
          ports:
            - { name: grpc, containerPort: 7100 }
            - { name: metrics, containerPort: 9100 }
          readinessProbe:
            grpc: { port: 7100 }
            periodSeconds: 2
          livenessProbe:
            grpc: { port: 7100 }
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.kv.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.kv.storage }} } }
---
# Keep a quorum's worth of replicas up during voluntary disruptions (node
# drains, upgrades): with N=3, W=2 one node at a time may go.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wheel-node
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: wheel-node }
