# Five-node CartwheelKV cluster (N=3, R=2, W=2), cart-svc, the lightning-deal
# pipeline (Postgres, Redis, Redpanda, deal-svc, two order-workers), gateway,
# storefront.
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#   open http://localhost:8088
name: cartwheel

x-cluster: &cluster
  CARTWHEEL_CLUSTER_ENABLED: "true"
  CARTWHEEL_CLUSTER_SEEDS: wheel-1=wheel-1:7100,wheel-2=wheel-2:7100,wheel-3=wheel-3:7100,wheel-4=wheel-4:7100,wheel-5=wheel-5:7100
  CARTWHEEL_CLUSTER_N: "3"
  CARTWHEEL_CLUSTER_R: "2"
  CARTWHEEL_CLUSTER_W: "2"
  CARTWHEEL_SERVER_LISTEN: 0.0.0.0:7100
  CARTWHEEL_METRICS_LISTEN: 0.0.0.0:9100
  CARTWHEEL_STORAGE_ENGINE: lsm
  # Demo stack: the ops console may isolate a node. Never enable in production.
  CARTWHEEL_DEBUG_FAULT_INJECTION: "true"

x-service: &service
  image: cartwheel:dev
  restart: unless-stopped
  environment: &service-env
    CARTWHEEL_TRACING_OTLP_ENDPOINT: jaeger:4317
  stop_grace_period: 10s   # covers drain grace + in-flight RPC deadline

x-deal-infra: &deal-infra
  CARTWHEEL_POSTGRES_URL: postgresql://cartwheel:cartwheel@postgres:5432/cartwheel
  CARTWHEEL_REDIS_URL: redis://redis:6379
  CARTWHEEL_KAFKA_BROKERS: redpanda:9092
  CARTWHEEL_KAFKA_REPLICATION: "1"   # single-broker dev stack; 3 in production

services:
  wheel-1:
    <<: *service
    build:
      context: ../..
      dockerfile: deploy/docker/services.Dockerfile
    command: ["wheel-node"]
    environment:
      <<: [*cluster, *service-env]
      CARTWHEEL_NODE_ID: wheel-1
      CARTWHEEL_NODE_ADVERTISE: wheel-1:7100
      CARTWHEEL_STORAGE_DIR: /data/wheel-1
    volumes: ["wheel-1-data:/data"]
    networks:
      default:
        aliases: [wheel]   # dns:///wheel:7100 resolves to all five nodes
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7100"]
      interval: 2s
      retries: 15

  wheel-2:
    <<: *service
    command: ["wheel-node"]
    environment:
      <<: [*cluster, *service-env]
      CARTWHEEL_NODE_ID: wheel-2
      CARTWHEEL_NODE_ADVERTISE: wheel-2:7100
      CARTWHEEL_STORAGE_DIR: /data/wheel-2
    volumes: ["wheel-2-data:/data"]
    networks:
      default:
        aliases: [wheel]   # dns:///wheel:7100 resolves to all five nodes
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7100"]
      interval: 2s
      retries: 15

  wheel-3:
    <<: *service
    command: ["wheel-node"]
    environment:
      <<: [*cluster, *service-env]
      CARTWHEEL_NODE_ID: wheel-3
      CARTWHEEL_NODE_ADVERTISE: wheel-3:7100
      CARTWHEEL_STORAGE_DIR: /data/wheel-3
    volumes: ["wheel-3-data:/data"]
    networks:
      default:
        aliases: [wheel]   # dns:///wheel:7100 resolves to all five nodes
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7100"]
      interval: 2s
      retries: 15

  wheel-4:
    <<: *service
    command: ["wheel-node"]
    environment:
      <<: [*cluster, *service-env]
      CARTWHEEL_NODE_ID: wheel-4
      CARTWHEEL_NODE_ADVERTISE: wheel-4:7100
      CARTWHEEL_STORAGE_DIR: /data/wheel-4
    volumes: ["wheel-4-data:/data"]
    networks:
      default:
        aliases: [wheel]   # dns:///wheel:7100 resolves to all five nodes
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7100"]
      interval: 2s
      retries: 15

  wheel-5:
    <<: *service
    command: ["wheel-node"]
    environment:
      <<: [*cluster, *service-env]
      CARTWHEEL_NODE_ID: wheel-5
      CARTWHEEL_NODE_ADVERTISE: wheel-5:7100
      CARTWHEEL_STORAGE_DIR: /data/wheel-5
    volumes: ["wheel-5-data:/data"]
    networks:
      default:
        aliases: [wheel]   # dns:///wheel:7100 resolves to all five nodes
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7100"]
      interval: 2s
      retries: 15

  cart-svc:
    <<: *service
    command: ["cart-svc"]
    environment:
      <<: *service-env
      CARTWHEEL_SERVER_LISTEN: 0.0.0.0:7200
      CARTWHEEL_KV_TARGET: dns:///wheel:7100
      CARTWHEEL_METRICS_LISTEN: 0.0.0.0:9200
    depends_on:
      wheel-1: { condition: service_healthy }
      wheel-2: { condition: service_healthy }
      wheel-3: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7200"]
      interval: 2s
      retries: 15

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cartwheel
      POSTGRES_PASSWORD: cartwheel
      POSTGRES_DB: cartwheel
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cartwheel"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    # AOF: a restart keeps holds; losing them is still safe (Postgres re-checks).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 3s
      retries: 30

  deal-svc:
    <<: *service
    command: ["deal-svc"]
    environment:
      <<: [*deal-infra, *service-env]
      CARTWHEEL_SERVER_LISTEN: 0.0.0.0:7300
      CARTWHEEL_METRICS_LISTEN: 0.0.0.0:9300
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/7300"]
      interval: 2s
      retries: 30

  # Two workers in one consumer group share the topic's partitions; kill one
  # and the other takes its partitions after session.timeout.ms (10 s).
  order-worker-1: &order-worker
    <<: *service
    command: ["order-worker"]
    environment:
      <<: [*deal-infra, *service-env]
      CARTWHEEL_METRICS_LISTEN: 0.0.0.0:9400
    depends_on:
      deal-svc: { condition: service_healthy }

  order-worker-2: *order-worker

  gateway:
    <<: *service
    command: ["gateway"]
    environment:
      <<: *service-env
      CARTWHEEL_SERVER_PORT: "8080"
      CARTWHEEL_CART_TARGET: cart-svc:7200
      CARTWHEEL_DEAL_TARGET: deal-svc:7300
      CARTWHEEL_NOTIFY_REDIS_URL: redis://redis:6379
      CARTWHEEL_OPS_KV_NODES: wheel-1=wheel-1:7100,wheel-2=wheel-2:7100,wheel-3=wheel-3:7100,wheel-4=wheel-4:7100,wheel-5=wheel-5:7100
      # Demo values; set real secrets through the environment.
      CARTWHEEL_AUTH_JWT_SECRET: ${CARTWHEEL_JWT_SECRET:-compose-dev-secret}
      CARTWHEEL_AUTH_ADMIN_TOKEN: ${CARTWHEEL_ADMIN_TOKEN:-dev-admin}
    ports: ["8080:8080"]
    depends_on:
      cart-svc: { condition: service_healthy }
      deal-svc: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      retries: 15

  # ---- observability ------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686"]   # traces UI; services export OTLP/gRPC to jaeger:4317

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ../observability/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:latest
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]   # dashboard: /d/cartwheel

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    image: cartwheel-web:dev
    ports: ["8088:80"]
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  wheel-1-data:
  wheel-2-data:
  wheel-3-data:
  wheel-4-data:
  wheel-5-data:
  postgres-data:
  redis-data:
  redpanda-data:
