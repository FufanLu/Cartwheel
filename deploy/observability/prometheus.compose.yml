global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: wheel-node
    static_configs: [{ targets: ["wheel-1:9100", "wheel-2:9100", "wheel-3:9100", "wheel-4:9100", "wheel-5:9100"] }]
  - job_name: cart-svc
    static_configs: [{ targets: ["cart-svc:9200"] }]
  - job_name: deal-svc
    static_configs: [{ targets: ["deal-svc:9300"] }]
  - job_name: order-worker
    static_configs: [{ targets: ["order-worker-1:9400", "order-worker-2:9400"] }]
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"] }]
